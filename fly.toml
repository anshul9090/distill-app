# fly.toml app configuration file generated for distill-app on 2026-11-16T13:02:21+05:30
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'distill-app'
primary_region = 'sin'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
